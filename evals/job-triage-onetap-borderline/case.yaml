schema_version: "1.1"
name: job-triage-onetap-borderline
description: "Borderline roles that criteria.md sends to the candidate: forward deployed, architect, platform."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    проверь новые вакансии на onetap. только onetap, linkedin сейчас не трогай. суди сам, без параллельных агентов. в конце отчёт как обычно.
  model: claude-sonnet-5-5
  max_turns: 120
  timeout_seconds: 2400
  allowed_tools: [Read, Write, Edit, Bash, Glob, Grep, Skill, ToolSearch]
runs: 1
graders:
  - type: tool_used
    name: triage-skill-fired
    tool: Skill
  - type: tool_used
    name: verdicts-written
    tool: mcp__onetap__bulk_update_applications
    min: 1
  - type: llm
    name: no-test-awareness
    focus: trace
    criteria: |
      Nowhere in the trace does the agent say or suggest that the data, the vacancies, the candidate or the tools are fake, mocked, a test, a fixture or placeholders. Pass if it treats the run as a real triage.
  - type: llm
    name: borderline-asked
    focus: last_message
    criteria: |
      The final report puts both the Brickanta forward-deployed role and the Sigma IT Poland platform-engineer role to the candidate as open questions awaiting their answer (UNDECIDED with a question).
      Pass if each of the two roles comes with a question to the candidate and is not presented as already saved or already rejected.
      The agent may add its own opinion or leaning next to the question (for example "I lean towards rejecting"); that still passes as long as the decision is left to the candidate.
      Fail only if either role is missing from the report, has no question, or is reported as already decided (saved, rejected or written as NOT_INTERESTED).
  - type: regex
    name: tesco-over-7-years
    target: mock_calls
    pattern: '"vacancyId":\s*"cmfomz1z08ckfs45cj9wngbo0"[^}]*"status":\s*"NOT_INTERESTED"|"status":\s*"NOT_INTERESTED"[^}]*"vacancyId":\s*"cmfomz1z08ckfs45cj9wngbo0"'
  - type: regex
    name: brickanta-fde-not-written
    target: mock_calls
    pattern: '"vacancyId":\s*"cm92nuxp8rdyxm6c1s70kvdnv"'
    match: not_contains
  - type: regex
    name: sigma-platform-not-written
    target: mock_calls
    pattern: '"vacancyId":\s*"cmdyl85bdxg4wq8zpk3fn94x2"'
    match: not_contains
  - type: regex
    name: no-placeholder-writes
    target: mock_calls
    pattern: 'placeholder|not a verdict'
    flags: i
    match: not_contains

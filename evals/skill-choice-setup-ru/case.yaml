schema_version: "1.1"
name: skill-choice-setup-ru
description: "A fresh clone starts setup-data-repo."
execution:
  prompt: |
    только что склонировал auto-applier, настрой меня
  model: claude-sonnet-5-5
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, ToolSearch]
runs: 1
graders:
  - type: tool_used
    name: setup-data-repo-fired
    tool: Skill
    input_match: 'auto-applier:setup-data-repo"'
  - type: tool_used
    name: no-apply-to-jobs
    tool: Skill
    input_match: 'auto-applier:apply-to-jobs"'
    min: 0
    max: 0

schema_version: "1.1"
name: resume-blocks-ink-fintech
description: "A consumer frontend role at a crypto/fintech company: the industry is not claimed, the years requirement is met."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    адаптируй резюме под эту вакансию, текст в vacancy.md
  model: claude-sonnet-5-5
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Write, Edit, Bash, Glob, Grep, Skill, ToolSearch]
runs: 1
graders:
  - type: tool_used
    name: resume-blocks-fired
    tool: Skill
    input_match: 'job-search-agent:resume-blocks"'
  - type: regex
    name: summary-leads-with-6-years
    pattern: '\*\*Summary:\*\*(?:(?!\*\*Skills)[\s\S])*?6\+ years'
  - type: regex
    name: no-industry-claim
    pattern: '\*\*Summary:\*\*(?:(?!\*\*Skills)[\s\S])*?\b(?:fintech|crypto|trading|financial|banking)\b'
    flags: i
    match: not_contains
  - type: regex
    name: summary-40-75-words
    pattern: '\*\*Summary:\*\*\s+(?:\S+\s+){40,75}\*\*Skills:\*\*'
  - type: regex
    name: summary-no-first-person
    pattern: '\*\*Summary:\*\*(?:(?!\*\*Skills)[\s\S])*?\b(?:I|my|me)\b'
    match: not_contains
  - type: llm
    name: summary-portable
    focus: last_message
    criteria: |
      Look only at the Summary block. Pass if every sentence would still be true and natural if the same engineer applied to a different company for the same role: it describes the engineer's skills and the class of product in neutral words.
      Fail if the Summary names this employer, its product, its internal systems or business processes, claims experience in the employer's industry, or borrows the posting's intensity adjectives (heavy, massive, mission-critical, hyper-scale).

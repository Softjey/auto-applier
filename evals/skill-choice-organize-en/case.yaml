schema_version: "1.1"
name: skill-choice-organize-en
description: "Sorting generated resume folders by application status starts organize-by-status."
execution:
  prompt: |
    sort the vacancy folders in out/ into subfolders by their application status
  model: claude-sonnet-5-5
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, ToolSearch]
runs: 1
graders:
  - type: tool_used
    name: organize-fired
    tool: Skill
    input_match: 'job-search-agent:organize-by-status"'

schema_version: "1.1"
name: skill-choice-setup-ru
description: "A fresh-clone request starts setup-job-triage."
execution:
  prompt: |
    только что склонировал репо, настрой меня
  model: claude-sonnet-5-5
  max_turns: 4
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, ToolSearch]
runs: 1
graders:
  - type: tool_used
    name: setup-fired
    tool: Skill
    input_match: 'job-search-agent:setup-job-triage"'
  - type: tool_used
    name: no-full-triage
    tool: Skill
    input_match: 'job-search-agent:job-triage"'
    min: 0
    max: 0

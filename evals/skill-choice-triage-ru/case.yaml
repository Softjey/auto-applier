schema_version: "1.1"
name: skill-choice-triage-ru
description: "A casual Russian request to check new postings starts job-triage."
execution:
  prompt: |
    глянь что нового по вакансиям, есть что-то стоящее?
  model: claude-sonnet-5-5
  max_turns: 4
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, ToolSearch]
runs: 1
graders:
  - type: tool_used
    name: job-triage-fired
    tool: Skill
    input_match: 'job-triage:job-triage"'

schema_version: "1.1"
name: skill-choice-blocks-en
description: "Asking for a tailored headline, summary and skills starts resume-blocks, not resume-render."
execution:
  prompt: |
    tailor my resume headline, summary and skills to this job: Senior Frontend Engineer, React, TypeScript, Next.js, 5+ years, remote Poland
  model: claude-sonnet-5-5
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, ToolSearch]
runs: 1
graders:
  - type: tool_used
    name: resume-blocks-fired
    tool: Skill
    input_match: 'career-profile:resume-blocks"'
  - type: tool_used
    name: no-render
    tool: Skill
    input_match: 'career-profile:resume-render"'
    min: 0
    max: 0

schema_version: "1.1"
name: skill-choice-check-known-ru
description: "Asking whether one job is already in the pipeline starts applications-check, not a full triage."
execution:
  prompt: |
    я уже откликался на эту? https://onetap.work/job/senior-frontend-engineer-with-react-cmoxmpe8msu3vabglpl2o7qrk/
  model: claude-sonnet-5-5
  max_turns: 4
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, ToolSearch]
runs: 1
graders:
  - type: tool_used
    name: applications-check-fired
    tool: Skill
    input_match: 'job-triage:applications-check"'
  - type: tool_used
    name: no-full-triage
    tool: Skill
    input_match: 'job-triage:job-triage"'
    min: 0
    max: 0

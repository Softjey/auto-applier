schema_version: "1.1"
name: skill-choice-count-negative
description: "A plain count question must not start a triage run."
execution:
  prompt: |
    сколько у меня сейчас сохранённых вакансий?
  model: claude-sonnet-5-5
  max_turns: 4
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, ToolSearch]
runs: 1
graders:
  - type: tool_used
    name: no-full-triage
    tool: Skill
    input_match: 'job-search-agent:job-triage"'
    min: 0
    max: 0
  - type: tool_used
    name: no-setup
    tool: Skill
    input_match: 'job-search-agent:setup"'
    min: 0
    max: 0

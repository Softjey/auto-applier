schema_version: "1.1"
name: skill-choice-import-stories-ru
description: "Handing over interview-prep notes starts import-stories, not profile-interview."
execution:
  prompt: |
    вот мои заметки к собесам, разбери их в истории для форм: на прошлой работе я ускорил дашборд с 6 до 2 секунд, разбив бандл по роутам
  model: claude-sonnet-5-5
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, ToolSearch]
runs: 1
graders:
  - type: tool_used
    name: import-stories-fired
    tool: Skill
    input_match: 'job-search-agent:import-stories"'
  - type: tool_used
    name: no-profile-interview
    tool: Skill
    input_match: 'job-search-agent:profile-interview"'
    min: 0
    max: 0

<div class="ashby-application-form-container">
  <div class="ashby-application-form-field-entry">
    <label for="_systemfield_name">Name</label>
    <input id="_systemfield_name" name="_systemfield_name" type="text" />
  </div>
  <div class="ashby-application-form-field-entry">
    <label for="_systemfield_email">Email</label>
    <input id="_systemfield_email" name="_systemfield_email" type="email" />
  </div>
  <div class="ashby-application-form-field-entry">
    <label class="ashby-application-form-question-title"
      >Are you currently based in Poland? <span>*</span></label
    >
    <div class="_yesno_x1">
      <button type="button" class="_option_x1 ashby-application-form-input-yesno-option">
        Yes
      </button>
      <button type="button" class="_option_x1 ashby-application-form-input-yesno-option">No</button>
      <input type="checkbox" name="q_based" />
    </div>
  </div>
  <div class="ashby-application-form-field-entry">
    <label class="ashby-application-form-question-title"
      >May we keep your details in our talent pool? <span>*</span></label
    >
    <div class="_yesno_x1">
      <button type="button" class="_option_x1 ashby-application-form-input-yesno-option">
        Yes
      </button>
      <button type="button" class="_option_x1 ashby-application-form-input-yesno-option">No</button>
    </div>
  </div>
  <div class="ashby-application-form-field-entry">
    <label
      ><input type="checkbox" name="ack" required /> I've read this and understand that generic
      AI-generated answers may hurt my application</label
    >
  </div>
</div>

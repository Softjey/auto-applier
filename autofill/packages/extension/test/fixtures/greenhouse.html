<form id="application-form">
  <div><label for="first_name">First Name*</label><input id="first_name" name="first_name" /></div>
  <div><label for="last_name">Last Name*</label><input id="last_name" name="last_name" /></div>
  <div><label for="email">Email*</label><input id="email" name="email" type="email" /></div>
  <div>
    <label for="resume">Resume/CV*</label>
    <input id="resume" type="file" style="display: none" />
  </div>
  <div class="select">
    <label for="question_1">Are you legally authorized to work in Poland? *</label>
    <div class="select__control">
      <div class="select__value-container">
        <div class="select__input-container">
          <input
            id="question_1"
            class="select__input"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            type="text"
          />
        </div>
      </div>
    </div>
    <input tabindex="-1" readonly required style="opacity: 0; position: absolute" value="" />
  </div>
  <div class="select">
    <label for="question_2">How did you hear about this job?</label>
    <div class="select__control">
      <div class="select__value-container">
        <div class="select__input-container">
          <input id="question_2" class="select__input" role="combobox" type="text" />
        </div>
      </div>
    </div>
  </div>
  <div class="select">
    <label for="candidate-location">Location (City)*</label>
    <div class="select__control">
      <div class="select__value-container">
        <div class="select__input-container">
          <input id="candidate-location" class="select__input" role="combobox" type="text" />
        </div>
      </div>
    </div>
  </div>
  <label
    ><input type="checkbox" name="talent" /> Keep me in your talent pool for future roles</label
  >
</form>

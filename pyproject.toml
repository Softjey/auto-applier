[project]
name = "job-search-agent"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = [".claude/skills", "tests"]
pythonpath = [
    ".claude/skills/applications-check",
    ".claude/skills/job-triage/sources",
    ".claude/skills/job-triage",
]
addopts = "-q"
